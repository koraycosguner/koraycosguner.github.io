<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>World Cup 26 · Knockout Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --panel:#F1F4F9; --ink:#10141E; --muted:#6B7585; --line:#D9DEE8;
    --card:#FFFFFF; --card-2:#EEF2F8; --magenta:#2563EB; --teal:#0E9AA6; --gold:#C8901A; --bronze:#B07636;
    --wire:#CBD2DD;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
  .brand h1{margin:0;font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(17px,4.4vw,28px);
    letter-spacing:.04em;line-height:1;color:var(--ink);}
  .brand h1 .yr{color:var(--magenta);}
  .brand .sub{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .view-toggle button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:inherit;
    font-size:11.5px;font-weight:600;padding:8px 13px;cursor:pointer;}
  .view-toggle button.on{background:var(--panel);color:var(--ink);}
  .lang-toggle{display:flex;border:2px solid var(--magenta);border-radius:999px;overflow:hidden;box-shadow:0 2px 12px rgba(37,99,235,0.30);}
  .lang-toggle button{appearance:none;border:0;background:transparent;color:var(--ink);font-family:inherit;
    font-size:14px;font-weight:800;letter-spacing:.05em;padding:10px 18px;cursor:pointer;transition:background .15s,color .15s;}
  .lang-toggle button:hover{color:var(--magenta);}
  .lang-toggle button.on{background:var(--magenta);color:#fff;}
  .lang-toggle button.on:hover{color:#fff;}
  .champ-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);font-size:13px;white-space:nowrap;}
  .champ-chip .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .champ-chip .who{font-weight:700;color:var(--ink);}
  .champ-chip.full{border-color:var(--gold);box-shadow:0 0 0 1px rgba(200,144,26,.3),0 6px 18px rgba(200,144,26,.14);}
  .reset{appearance:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:999px;transition:.15s;}
  .reset:hover{border-color:var(--magenta);color:var(--magenta);}
  .reset:active{transform:translateY(1px);}

  .stage{position:relative;flex:1 1 auto;min-height:0;overflow:auto;cursor:grab;display:flex;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;}
  .stage.grabbing{cursor:grabbing;}
  .zoomer{position:relative;margin:auto;}
  .canvas{position:relative;transform-origin:top left;}

  svg.wires{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .wires path{fill:none;stroke:var(--wire);stroke-width:2;stroke-linejoin:round;transition:stroke .25s ease;}
  .wires path.lit{stroke:url(#flow);stroke-width:2.6;}

  .col-head{position:absolute;z-index:2;text-align:center;font-family:'Anton',sans-serif;font-weight:400;
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);top:8px;}
  .col-head span{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:8.5px;letter-spacing:.1em;color:var(--muted);margin-top:3px;}
  .col-head.final-head{color:var(--gold);font-size:15px;letter-spacing:.14em;}

  .card{position:absolute;z-index:3;}
  .tag{display:flex;justify-content:space-between;align-items:center;font-size:8.5px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 3px 3px;}
  .tag .city{color:#9AA3B2;font-weight:500;}
  .card.side-r .tag{flex-direction:row-reverse;}
  .match{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);box-shadow:0 2px 10px rgba(16,20,30,.06);}
  .slot{display:flex;align-items:center;justify-content:flex-start;gap:5px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    font-family:inherit;padding:5px 8px;cursor:pointer;font-size:12px;line-height:1.1;border-bottom:1px solid var(--line);transition:background .15s,color .15s;}
  .slot:last-child{border-bottom:0;}
  .slot:hover:not(.empty){background:var(--card-2);}
  .slot:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;}
  .card.side-r .slot{flex-direction:row-reverse;justify-content:flex-start;text-align:right;}
  .flag{font-size:14px;width:17px;text-align:center;flex:none;}
  .name{flex:0 1 auto;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card.side-r .name{text-align:right;}
  .seed{display:none;}
  .slot.empty{cursor:default;color:var(--muted);}
  .slot.empty .name{font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:9.5px;color:var(--muted);}
  .slot.empty .flag{opacity:.2;}
  .slot.win{background:linear-gradient(90deg,#2563EB,#3B82F6);color:#fff;font-weight:700;}
  .card.side-r .slot.win{background:linear-gradient(270deg,#2563EB,#3B82F6);}
  .slot.win .seed{color:rgba(255,255,255,.85);}
  .slot.lose{opacity:.4;}
  .slot.lose .name{text-decoration:line-through;text-decoration-color:rgba(16,20,30,.35);}

  /* Round of 32 head-to-head rows in the bracket */
  .trow{position:absolute;z-index:3;}
  .trowbox{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    background:var(--card);box-shadow:0 2px 9px rgba(16,20,30,.06);}
  .tteam{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5px;padding:5px 8px;border:0;background:transparent;text-align:left;
    color:var(--ink);font-family:inherit;font-size:12px;font-weight:600;line-height:1.1;cursor:pointer;transition:background .15s,color .15s;}
  .tteam:hover:not(.empty){background:var(--card-2);}
  .tteam:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;}
  .tteam.ttb{flex-direction:row-reverse;}
  .tteam .flag{font-size:14px;width:17px;text-align:center;flex:none;}
  .tteam .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tteam.ttb .name{text-align:right;}
  .tteam.empty{color:var(--muted);cursor:default;}
  .tteam.empty .name{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;}
  .tteam.empty .flag{opacity:.2;}
  .tteam.win{background:linear-gradient(90deg,#2563EB,#3B82F6);color:#fff;font-weight:700;}
  .tteam.ttb.win{background:linear-gradient(270deg,#2563EB,#3B82F6);}
  .tteam.lose{opacity:.4;}
  .tteam.lose .name{text-decoration:line-through;text-decoration-color:rgba(16,20,30,.35);}
  .tmid{flex:none;width:1px;background:var(--line);align-self:stretch;}

  .r32row.finalrow .r32team.win{background:linear-gradient(90deg,#F5C518,#FFD84D);color:#10141E;}
  .r32row.finalrow .r32team.tb.win{background:linear-gradient(270deg,#F5C518,#FFD84D);}
  .r32row.thirdrow .r32team.win{background:linear-gradient(90deg,#C9803B,#D99A5E);color:#fff;}
  .r32row.thirdrow .r32team.tb.win{background:linear-gradient(270deg,#C9803B,#D99A5E);}

  .pulse{animation:pulse .45s ease;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}100%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}

  .final-box .match{border:1.5px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(16,20,30,.12);}
  .final-box .slot.win{background:linear-gradient(90deg,#F5C518,#FFD84D);color:#10141E;}
  .final-box.crowned .match{border-color:var(--gold);box-shadow:0 0 0 1px rgba(200,144,26,.45),0 14px 40px rgba(200,144,26,.2);}

  .champ-banner{position:absolute;z-index:4;text-align:center;opacity:0;transform:translateY(6px);
    transition:opacity .35s ease,transform .35s ease;pointer-events:none;}
  .champ-banner.show{opacity:1;transform:none;}
  .champ-banner .cup{font-size:28px;filter:drop-shadow(0 6px 12px rgba(200,144,26,.4));}
  .champ-banner .lbl{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:2px;}

  .third-box .cap{text-align:center;font-size:8.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-bottom:3px;}
  .third-box .match{border-style:dashed;border-radius:8px;background:#F7F9FC;}
  .third-box .slot{padding:6px 8px;font-size:11.5px;}
  .third-box .slot.win{background:linear-gradient(90deg,#C9803B,#D99A5E);color:#fff;}

  .zoom-ctl{position:fixed;right:12px;bottom:14px;z-index:40;display:flex;align-items:center;gap:5px;
    background:#FFFFFF;border:1px solid var(--line);border-radius:999px;padding:5px 6px;box-shadow:0 6px 18px rgba(16,20,30,.12);}
  .zoom-ctl button{appearance:none;border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;width:30px;height:30px;border-radius:50%;cursor:pointer;}
  .zoom-ctl button:hover{background:var(--card-2);}
  .zoom-ctl .zlabel{font-size:11px;color:var(--muted);min-width:46px;text-align:center;}
  .zoom-ctl .fit{width:auto;padding:0 11px;font-size:11.5px;font-weight:600;border:1px solid var(--line);height:26px;}

  .steps-wrap{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;}
  .steps{max-width:680px;margin:0 auto;padding:12px 12px 80px;}
  .champ-strip{display:none;align-items:center;gap:13px;justify-content:center;margin:2px 0 14px;padding:14px;
    border-radius:14px;border:1px solid var(--gold);background:linear-gradient(180deg,#FFF7E0,#FFFDF6);}
  .champ-strip.show{display:flex;}
  .champ-strip .cup{font-size:30px;filter:drop-shadow(0 6px 12px rgba(200,144,26,.4));}
  .champ-strip .cflag{font-size:30px;}
  .champ-strip .ctxt{display:flex;flex-direction:column;}
  .champ-strip .clbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .champ-strip .cname{font-family:'Anton',sans-serif;font-size:21px;letter-spacing:.02em;color:var(--ink);}

  .round-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;position:sticky;top:0;z-index:5;
    background:linear-gradient(180deg,var(--bg) 72%,rgba(255,255,255,0));}
  .tab{flex:0 0 auto;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit;}
  .tab.active{color:var(--ink);border-color:var(--teal);background:#E9F7F8;}
  .tab .badge{margin-left:6px;font-size:10px;color:var(--muted);font-weight:600;}
  .tab.active .badge{color:var(--teal);}
  .tab.done .badge{color:var(--gold);}

  .pane{display:flex;flex-direction:column;gap:7px;}
  .pane-head{display:flex;align-items:center;gap:10px;margin:4px 2px 2px;}
  .pane:not(:first-child) .pane-head{margin-top:16px;}
  .pane-head .pn{font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);}
  .pane-head .pc{font-size:11px;color:var(--muted);font-weight:600;}
  .pane-head .ln{flex:1;height:1px;background:var(--line);}

  .r32row{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    background:var(--card);box-shadow:0 2px 8px rgba(16,20,30,.05);}
  .r32team{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 11px;border:0;text-align:left;
    background:transparent;color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
  .r32team:hover:not(.empty){background:var(--card-2);}
  .r32team:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;}
  .r32team.tb{flex-direction:row-reverse;}
  .r32team.tb .name{text-align:right;}
  .r32team .flag{font-size:17px;width:22px;text-align:center;flex:none;}
  .r32team .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .r32team.win{background:linear-gradient(90deg,#2563EB,#3B82F6);color:#fff;}
  .r32team.tb.win{background:linear-gradient(270deg,#2563EB,#3B82F6);}
  .r32team.lose{opacity:.4;}
  .r32team.lose .name{text-decoration:line-through;text-decoration-color:rgba(16,20,30,.35);}
  .r32team.empty{color:var(--muted);cursor:default;}
  .r32mid{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:48px;padding:0 6px;
    font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    background:#F6F8FB;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;}

  .mcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 2px 8px rgba(16,20,30,.05);}
  .mhead{display:flex;flex-direction:column;gap:1px;padding:7px 12px 6px;border-bottom:1px solid var(--line);background:#F6F8FB;}
  .mhead .ttl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);}
  .mhead .ctx{font-size:10px;color:var(--muted);letter-spacing:.03em;}
  .mslot{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    font-family:inherit;font-size:14px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s;}
  .mslot:last-child{border-bottom:0;}
  .mslot:hover:not(.empty){background:var(--card-2);}
  .mslot:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;}
  .mslot .flag{font-size:21px;width:26px;text-align:center;flex:none;}
  .mslot .name{flex:1;font-weight:600;}
  .mslot .seed{font-size:10px;color:var(--muted);font-weight:700;flex:none;}
  .mslot.empty{color:var(--muted);cursor:default;}
  .mslot.empty .name{font-size:12px;text-transform:uppercase;letter-spacing:.06em;}
  .mslot.empty .flag{opacity:.2;}
  .mslot.win{background:linear-gradient(90deg,#2563EB,#3B82F6);color:#fff;font-weight:700;}
  .mslot.win .seed{color:rgba(255,255,255,.85);}
  .mslot.lose{opacity:.45;}
  .mslot.lose .name{text-decoration:line-through;text-decoration-color:rgba(16,20,30,.35);}
  .final-m .mhead{background:linear-gradient(180deg,#FFF7E0,transparent);}
  .final-m .mslot{justify-content:center;font-size:16px;}
  .final-m .mslot.win{background:linear-gradient(90deg,#F5C518,#FFD84D);color:#10141E;}
  .third-m .mslot.win{background:linear-gradient(90deg,#C9803B,#D99A5E);color:#fff;}

  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:#FFFFFF;border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;font-size:11.5px;color:var(--ink);letter-spacing:.02em;box-shadow:0 8px 22px rgba(16,20,30,.14);transition:opacity .4s;}
  .hint b{color:var(--teal);}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:1px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

  @media (max-width:560px){ .champ-chip{display:none;} }
  @media (prefers-reduced-motion: reduce){
    .pulse{animation:none!important;}
    .slot,.mslot,.wires path,.reset,.champ-banner{transition:none!important;}
    .confetti{display:none!important;}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1><span id="ttlText">FIFA World Cup</span> <span class="yr">26</span></h1>
      <div class="sub">Road to the Final · Knockout Bracket</div>
    </div>
    <div class="lang-toggle" id="langToggle">
      <button id="btnEN">EN</button><button id="btnTR">TR</button>
    </div>
    <div class="view-toggle" id="viewToggle">
      <button id="btnSteps">List</button><button id="btnTree">Bracket</button>
    </div>
    <div class="champ-chip" id="champChip"><span class="lbl">Champion</span><span class="who" id="champWho">—</span></div>
    <button class="reset" id="resetBtn">Reset</button>
  </header>

  <!-- bracket view -->
  <div class="stage" id="stage">
    <div class="zoomer" id="zoomer">
      <div class="canvas" id="canvas">
        <svg class="wires" id="wires" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#08A6B0"/>
          </linearGradient></defs>
        </svg>
      </div>
    </div>
  </div>

  <!-- step view -->
  <div class="steps-wrap" id="stepsWrap">
    <div class="steps">
      <div class="champ-strip" id="champStrip"></div>
      <div class="round-tabs" id="roundTabs"></div>
      <div class="panes" id="panes"></div>
    </div>
  </div>

  <div class="zoom-ctl" id="zoomCtl">
    <button id="zOut" aria-label="Zoom out">−</button>
    <span class="zlabel" id="zLabel">100%</span>
    <button id="zIn" aria-label="Zoom in">+</button>
    <button class="fit" id="zFit">Fit</button>
  </div>

  <div class="hint" id="hint">Tap a team to send them through · <b>drag to explore</b></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  var lang = "tr";
  var STR = {
    en:{ title:"FIFA World Cup", sub:"Road to the Final · Knockout Bracket", list:"List", bracket:"Bracket",
         champion:"Champion", reset:"Reset", hint:'Tap a team to send them through · <b>drag to explore</b>',
         awaiting:"Awaiting", worldChamp:"World Champion", thirdPlace:"3rd place", vs:"VS", third:"3RD", fit:"Fit",
         heads:["Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"],
         subs:["16 matches","8 matches","4 matches","2 matches","1 match"],
         short:["R32","R16","QF","SF","Final"] },
    tr:{ title:"FIFA Dünya Kupası", sub:"Finale Giden Yol · Eleme Tablosu", list:"Liste", bracket:"Tablo",
         champion:"Şampiyon", reset:"Sıfırla", hint:'Üst tura taşımak için bir takıma dokunun · <b>keşfetmek için sürükleyin</b>',
         awaiting:"Bekleniyor", worldChamp:"Dünya Şampiyonu", thirdPlace:"Üçüncülük", vs:"VS", third:"3.", fit:"Sığdır",
         heads:["Son 32","Son 16","Çeyrek Final","Yarı Final","Final"],
         subs:["16 maç","8 maç","4 maç","2 maç","1 maç"],
         short:["S32","S16","ÇF","YF","Final"] }
  };
  function L(){ return STR[lang]; }
  var MON_TR = {Jan:"Oca",Feb:"Şub",Mar:"Mar",Apr:"Nis",May:"May",Jun:"Haz",Jul:"Tem",Aug:"Ağu",Sep:"Eyl",Oct:"Eki",Nov:"Kas",Dec:"Ara"};
  function locDate(d){ if(lang!=="tr"||!d) return d; var p=d.split(" "); return p.length===2 ? p[1]+" "+(MON_TR[p[0]]||p[0]) : d; }

  var TEAMS = {
    "South Africa":{f:"🇿🇦",tr:"Güney Afrika"}, "Canada":{f:"🇨🇦",tr:"Kanada"}, "Germany":{f:"🇩🇪",tr:"Almanya"}, "Paraguay":{f:"🇵🇾",tr:"Paraguay"},
    "Netherlands":{f:"🇳🇱",tr:"Hollanda"}, "Morocco":{f:"🇲🇦",tr:"Fas"}, "Brazil":{f:"🇧🇷",tr:"Brezilya"}, "Japan":{f:"🇯🇵",tr:"Japonya"},
    "France":{f:"🇫🇷",tr:"Fransa"}, "Sweden":{f:"🇸🇪",tr:"İsveç"}, "Ivory Coast":{f:"🇨🇮",tr:"Fildişi Sahili"}, "Norway":{f:"🇳🇴",tr:"Norveç"},

  render();
})();
</script>
