  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {

}

}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

}

          explanation: &#x27;Iraq lies between Syria and Iran and north of Kuwait.&#x27;

        {

          prompt: &#x27;Which country is labeled H?&#x27;,
          options: [&#x27;Saudi Arabia&#x27;, &#x27;Turkey&#x27;, &#x27;Iraq&#x27;, &#x27;Kuwait&#x27;],
          answer: &#x27;Saudi Arabia&#x27;,
          image: images.political,
          alt: &#x27;Political map of Southwest Asia with countries labeled A through K&#x27;,
          explanation: &#x27;Saudi Arabia covers most of the Arabian Peninsula.&#x27;
        },
        {
          category: &#x27;physical&#x27;,
          prompt: &#x27;Which physical feature is labeled R?&#x27;,
          options: [&#x27;Arabian Sea&#x27;, &#x27;Red Sea&#x27;, &#x27;Persian Gulf&#x27;, &#x27;Mediterranean Sea&#x27;],

      ];

      const labels = {
        all: &#x27;Mixed review&#x27;,
        capitals: &#x27;Capitals&#x27;,
        countries: &#x27;Political map&#x27;,
        physical: &#x27;Physical features&#x27;
      };
      const puzzleCountries = [
        { letter: &#x27;A&#x27;, country: &#x27;Syria&#x27;, x: 35, y: 41 },
        { letter: &#x27;B&#x27;, country: &#x27;Iraq&#x27;, x: 44, y: 45 },
        { letter: &#x27;C&#x27;, country: &#x27;Iran&#x27;, x: 63, y: 44 },
        { letter: &#x27;F&#x27;, country: &#x27;Israel&#x27;, x: 13, y: 27 },
        { letter: &#x27;G&#x27;, country: &#x27;Afghanistan&#x27;, x: 83, y: 44 },

        { letter: &#x27;I&#x27;, country: &#x27;Kuwait&#x27;, x: 56, y: 55 },

      ];
      const mode = root.querySelector(&#x27;#sq-mode&#x27;);
      const game = root.querySelector(&#x27;#sq-game&#x27;);

      const progress = root.querySelector(&#x27;#sq-progress&#x27;);
      const category = root.querySelector(&#x27;#sq-category&#x27;);
      const question = root.querySelector(&#x27;#sq-question&#x27;);

      const answers = root.querySelector(&#x27;#sq-answers&#x27;);
      const feedback = root.querySelector(&#x27;#sq-feedback&#x27;);
      const explanation = root.querySelector(&#x27;#sq-explanation&#x27;);
      const tip = root.querySelector(&#x27;#sq-tip&#x27;);
      const next = root.querySelector(&#x27;#sq-next&#x27;);
      const resultTitle = root.querySelector(&#x27;#sq-result-title&#x27;);
      const resultNote = root.querySelector(&#x27;#sq-result-note&#x27;);
      const retry = root.querySelector(&#x27;#sq-retry&#x27;);
      const restart = root.querySelector(&#x27;#sq-restart&#x27;);
      const missedWrap = root.querySelector(&#x27;#sq-missed-wrap&#x27;);
      const missedBody = root.querySelector(&#x27;#sq-missed&#x27;);
      const puzzleMap = root.querySelector(&#x27;#sq-puzzle-map&#x27;);
      const puzzleImage = root.querySelector(&#x27;#sq-puzzle-image&#x27;);
      const pieces = root.querySelector(&#x27;#sq-pieces&#x27;);
      const puzzleScore = root.querySelector(&#x27;#sq-puzzle-score&#x27;);
      const puzzleFeedback = root.querySelector(&#x27;#sq-puzzle-feedback&#x27;);
      const puzzleReset = root.querySelector(&#x27;#sq-puzzle-reset&#x27;);

      let pool = [];
      let index = 0;
      let correct = 0;
      let streak = 0;
      let missed = [];
      let answered = false;
      let selectedPiece = &#x27;&#x27;;
      let placedCountries = new Set();

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i &gt; 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function start(customPool) {
        if (mode.value === &#x27;puzzle&#x27;) {
          startPuzzle();
          return;
        }
        const selected = mode.value === &#x27;all&#x27;
          ? questions
          : questions.filter(item =&gt; item.category === mode.value);
        pool = shuffle(customPool || selected);
        index = 0;
        correct = 0;
        streak = 0;
        missed = [];
        game.hidden = false;
        puzzle.hidden = true;
        results.hidden = true;
        renderQuestion();
      }

      function startPuzzle() {
        selectedPiece = &#x27;&#x27;;
        placedCountries = new Set();
        game.hidden = true;
        results.hidden = true;
        puzzle.hidden = false;
        puzzleImage.src = images.political;
        puzzleFeedback.textContent = &#x27;Choose a country piece to begin.&#x27;;
        puzzleScore.textContent = &#x27;0 of 8 placed&#x27;;

        puzzleMap.querySelectorAll(&#x27;.sq-target&#x27;).forEach(target =&gt; target.remove());
        puzzleCountries.forEach(item =&gt; {
          const target = document.createElement(&#x27;button&#x27;);
          target.type = &#x27;button&#x27;;
          target.className = &#x27;sq-target&#x27;;
          target.dataset.country = item.country;
          target.style.left = `${item.x}%`;
          target.style.top = `${item.y}%`;
          target.textContent = item.letter;
          target.setAttribute(&#x27;aria-label&#x27;, `Map target ${item.letter}`);
          target.addEventListener(&#x27;click&#x27;, () =&gt; tryPlacement(item.country, target));
          target.addEventListener(&#x27;dragover&#x27;, event =&gt; {
            event.preventDefault();
            target.classList.add(&#x27;sq-over&#x27;);
          });
          target.addEventListener(&#x27;dragleave&#x27;, () =&gt; target.classList.remove(&#x27;sq-over&#x27;));
          target.addEventListener(&#x27;drop&#x27;, event =&gt; {
            event.preventDefault();
            target.classList.remove(&#x27;sq-over&#x27;);
            const country = event.dataTransfer.getData(&#x27;text/plain&#x27;);
            tryPlacement(item.country, target, country);
          });
          puzzleMap.appendChild(target);
        });

        pieces.replaceChildren();
        shuffle(puzzleCountries).forEach(item =&gt; {
          const piece = document.createElement(&#x27;button&#x27;);
          piece.type = &#x27;button&#x27;;
          piece.className = &#x27;btn sq-piece&#x27;;
          piece.textContent = item.country;
          piece.draggable = true;
          piece.dataset.country = item.country;
          piece.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
          piece.addEventListener(&#x27;click&#x27;, () =&gt; selectPiece(item.country));
          piece.addEventListener(&#x27;dragstart&#x27;, event =&gt; {
            selectPiece(item.country);
            event.dataTransfer.setData(&#x27;text/plain&#x27;, item.country);
            event.dataTransfer.effectAllowed = &#x27;move&#x27;;
          });
          pieces.appendChild(piece);
        });
      }

      function selectPiece(country) {
        if (placedCountries.has(country)) return;
        selectedPiece = country;
        [...pieces.querySelectorAll(&#x27;.sq-piece&#x27;)].forEach(piece =&gt; {
          piece.setAttribute(&#x27;aria-pressed&#x27;, String(piece.dataset.country === country));
        });
        puzzleFeedback.textContent = `${country} selected. Now choose its letter on the map.`;
      }

      function tryPlacement(expectedCountry, target, draggedCountry) {
        const country = draggedCountry || selectedPiece;
        if (!country || target.disabled) {
          if (!country) puzzleFeedback.textContent = &#x27;Choose a country piece first, then choose a letter.&#x27;;
          return;
        }
        if (country !== expectedCountry) {
          puzzleFeedback.textContent = `${country} does not go at ${target.textContent}. Try another letter.`;
          return;
        }

        placedCountries.add(country);
        target.textContent = country;
        target.classList.add(&#x27;sq-placed&#x27;);
        target.disabled = true;
        target.setAttribute(&#x27;aria-label&#x27;, `${country} correctly placed`);
        const piece = pieces.querySelector(`[data-country=&quot;${country}&quot;]`);
        if (piece) {
          piece.disabled = true;
          piece.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
        }
        selectedPiece = &#x27;&#x27;;
        puzzleScore.textContent = `${placedCountries.size} of ${puzzleCountries.length} placed`;
        if (placedCountries.size === puzzleCountries.length) {
          puzzleFeedback.textContent = &#x27;Puzzle complete — all eight countries are in the right place!&#x27;;
          puzzleReset.focus();
        } else {
          puzzleFeedback.textContent = `Correct — ${country} is in place. Choose the next piece.`;
        }
      }

      function renderQuestion() {
        answered = false;
        const item = pool[index];
        count.textContent = `Question ${index + 1} of ${pool.length}`;
        score.textContent = `Score: ${correct} · Streak: ${streak}`;
        progress.value = index + 1;
        progress.max = pool.length;
        progress.textContent = `${index + 1} of ${pool.length}`;
        category.textContent = labels[item.category];
        question.textContent = item.prompt;
        feedback.textContent = &#x27;&#x27;;
        explanation.textContent = &#x27;&#x27;;
        explanation.hidden = true;
        tip.textContent = &#x27;Pick the best answer.&#x27;;
        next.hidden = true;

        if (item.image) {
          image.src = item.image;
          image.alt = item.alt;
          imageWrap.hidden = false;
        } else {
          image.removeAttribute(&#x27;src&#x27;);
          image.alt = &#x27;&#x27;;
          imageWrap.hidden = true;
        }

        answers.replaceChildren();
        shuffle(item.options).forEach(option =&gt; {
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = &#x27;btn btn-block&#x27;;
          button.textContent = option;
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
          button.addEventListener(&#x27;click&#x27;, () =&gt; answerQuestion(option, button));
          answers.appendChild(button);
        });
      }

      function answerQuestion(choice, selectedButton) {
        if (answered) return;
        answered = true;
        const item = pool[index];
        const isCorrect = choice === item.answer;
        if (isCorrect) {
          correct += 1;
          streak += 1;
          feedback.textContent = &#x27;Correct!&#x27;;
        } else {
          streak = 0;
          missed.push(item);
          feedback.textContent = `Not quite. The correct answer is ${item.answer}.`;
        }
        score.textContent = `Score: ${correct} · Streak: ${streak}`;
        [...answers.querySelectorAll(&#x27;button&#x27;)].forEach(button =&gt; {
          const original = button.textContent;
          button.disabled = true;
          if (original === item.answer) button.textContent = `${original} — ✓ Correct answer`;
          if (button === selectedButton) button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
        });
        explanation.textContent = item.explanation;
        explanation.hidden = false;
        tip.textContent = `${correct} correct so far`;
        next.textContent = index + 1 === pool.length ? &#x27;See results&#x27; : &#x27;Next question&#x27;;
        next.hidden = false;
        next.focus();
      }

      function showResults() {
        game.hidden = true;
        results.hidden = false;
        const percent = Math.round((correct / pool.length) * 100);
        resultTitle.textContent = `${correct} out of ${pool.length} correct (${percent}%)`;
        resultNote.textContent = percent === 100
          ? &#x27;Excellent — every answer was correct.&#x27;
          : percent &gt;= 80
            ? &#x27;Strong work. Review the missed items once more.&#x27;
            : &#x27;Good practice. Retry the missed items to strengthen the map connections.&#x27;;
        retry.hidden = missed.length === 0;
        missedWrap.hidden = missed.length === 0;
        missedBody.replaceChildren();
        missed.forEach(item =&gt; {
          const row = document.createElement(&#x27;tr&#x27;);
          const promptCell = document.createElement(&#x27;td&#x27;);
          const answerCell = document.createElement(&#x27;td&#x27;);
          promptCell.textContent = item.prompt;
          answerCell.textContent = item.answer;
          row.append(promptCell, answerCell);
          missedBody.appendChild(row);
        });
        restart.focus();
      }

      next.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (index + 1 === pool.length) showResults();
        else {
          index += 1;
          renderQuestion();
        }
      });
      retry.addEventListener(&#x27;click&#x27;, () =&gt; start([...missed]));
      restart.addEventListener(&#x27;click&#x27;, () =&gt; start());
      mode.addEventListener(&#x27;change&#x27;, () =&gt; start());
      puzzleReset.addEventListener(&#x27;click&#x27;, startPuzzle);

      start();
